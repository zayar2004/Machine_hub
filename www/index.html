<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Machine Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #818cf8, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
    }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { font-size: 14px; color: #71717a; }
  </style>
</head>
<body>
  <div class="loading">
    <div class="logo">MH</div>
    <div class="title">Machine Hub</div>
    <div class="subtitle">Loading...</div>
  </div>
  <script>
    window.location.href = 'https://machine-hub.onrender.com/';
  </script>
</body>
</html>

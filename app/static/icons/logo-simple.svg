<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#g1)"/>

  <!-- Wrench icon + Hub dots -->
  <g transform="translate(256, 240)">
    <!-- Hub center -->
    <circle cx="0" cy="0" r="20" fill="#ffffff"/>

    <!-- Spokes -->
    <g stroke="#ffffff" stroke-width="18" stroke-linecap="round">
      <line x1="0" y1="-60" x2="0" y2="-100"/>
      <line x1="0" y1="60" x2="0" y2="100"/>
      <line x1="-60" y1="0" x2="-100" y2="0"/>
      <line x1="60" y1="0" x2="100" y2="0"/>
      <line x1="-45" y1="-45" x2="-72" y2="-72"/>
      <line x1="45" y1="-45" x2="72" y2="-72"/>
      <line x1="-45" y1="45" x2="-72" y2="72"/>
      <line x1="45" y1="45" x2="72" y2="72"/>
    </g>

    <!-- Hub nodes at ends -->
    <g fill="#ffffff">
      <circle cx="0" cy="-100" r="14"/>
      <circle cx="0" cy="100" r="14"/>
      <circle cx="-100" cy="0" r="14"/>
      <circle cx="100" cy="0" r="14"/>
      <circle cx="-72" cy="-72" r="12"/>
      <circle cx="72" cy="-72" r="12"/>
      <circle cx="-72" cy="72" r="12"/>
      <circle cx="72" cy="72" r="12"/>
    </g>
  </g>

  <!-- "MH" text -->
  <text x="256" y="410" font-family="system-ui, -apple-system, sans-serif"
        font-size="90" font-weight="800" fill="#ffffff"
        text-anchor="middle" letter-spacing="-3">MH</text>
</svg>

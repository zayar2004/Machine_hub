<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner glow circle -->
  <circle cx="256" cy="256" r="180" fill="rgba(255,255,255,0.08)"/>

  <!-- Gear/Machine block -->
  <g transform="translate(256, 256)">
    <!-- Gear teeth (8) -->
    <g fill="url(#iconGrad)">
      <rect x="-24" y="-130" width="48" height="60" rx="8"/>
      <rect x="-24" y="70" width="48" height="60" rx="8"/>
      <rect x="-130" y="-24" width="60" height="48" rx="8"/>
      <rect x="70" y="-24" width="60" height="48" rx="8"/>
      <rect x="-24" y="-130" width="48" height="60" rx="8" transform="rotate(45)"/>
      <rect x="-24" y="70" width="48" height="60" rx="8" transform="rotate(45)"/>
      <rect x="-130" y="-24" width="60" height="48" rx="8" transform="rotate(45)"/>
      <rect x="70" y="-24" width="60" height="48" rx="8" transform="rotate(45)"/>
    </g>

    <!-- Center circle -->
    <circle cx="0" cy="0" r="100" fill="url(#iconGrad)"/>

    <!-- Inner ring -->
    <circle cx="0" cy="0" r="70" fill="url(#bgGrad)"/>

    <!-- Wrench icon inside -->
    <g transform="rotate(-45)" fill="url(#iconGrad)">
      <path d="M -8 -50 L 8 -50 L 8 -20 C 12 -18 14 -14 14 -10 L 14 10 C 14 16 12 22 8 26 L 8 50 L -8 50 L -8 26 C -12 22 -14 16 -14 10 L -14 -10 C -14 -14 -12 -18 -8 -20 Z"/>
    </g>
  </g>

  <!-- Top-right dot (notification style) -->
  <circle cx="410" cy="102" r="24" fill="#22c55e"/>
</svg>
